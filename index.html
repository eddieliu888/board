<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業線上教學白板 - 完整穩定版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #dcdde1;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            touch-action: none;
        }

        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 3000px;
            height: 2000px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            transform-origin: 0 0;
        }

        #image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        #whiteboard {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        #shape-preview {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        /* 關鍵修正：整層永遠不攔截空白區域事件 */
        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .text-wrapper {
            position: absolute;
            transform-origin: 0 0;
            pointer-events: none;
            z-index: 20;
        }

        .text-wrapper.active {
            z-index: 21;
        }

        .text-drag-handle {
            position: absolute;
            left: 0;
            right: 0;
            top: -26px;
            height: 24px;
            background-color: #3498db;
            color: white;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            cursor: move;
            border-radius: 6px 6px 0 0;
            user-select: none;
            touch-action: none;
            font-family: sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        .text-wrapper.active .text-drag-handle {
            display: flex;
        }

        .drag-text {
            pointer-events: none;
        }

        .text-copy-btn, .text-del-btn {
            cursor: pointer;
            pointer-events: auto;
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .text-copy-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .text-del-btn:hover {
            background: #e74c3c;
            color: white;
        }

        .text-box {
            position: relative;
            padding: 6px 10px;
            border: 2px dashed transparent;
            color: #000000;
            outline: none;
            cursor: text;
            resize: none; /* 修正：預設隱藏縮放點 */
            overflow: hidden; /* 修正：隱藏多餘的縮放空間 */
            font-weight: bold;
            border-radius: 6px;
            min-width: 50px;
            min-height: 30px;
            white-space: pre;
            box-sizing: border-box;
            background-clip: padding-box;
        }

        .text-wrapper.active .text-box {
            border-color: #3498db;
            background-color: #ffffff !important;
            resize: both; /* 修正：只有在被選取/編輯時，才允許縮放並顯示縮放點 */
            overflow: auto;
        }

        .text-box::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            display: none;
        }

        .pasted-image-wrapper {
            position: absolute;
            border: 2px dashed transparent;
            user-select: none;
        }

        .pasted-image-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        body.mode-move .pasted-image-wrapper {
            border-color: #3498db;
            cursor: grab;
            pointer-events: auto;
        }

        body.mode-move .pasted-image-wrapper:active {
            cursor: grabbing;
        }

        body.mode-move .img-del-btn, 
        body.mode-move .img-copy-btn {
            display: block;
        }

        .img-del-btn {
            display: none;
            position: absolute;
            top: -15px;
            right: -15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 6;
        }

        .img-copy-btn {
            display: none;
            position: absolute;
            top: -15px;
            right: 25px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 6;
        }

        #btn-toggle-toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: none;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #2980b9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        #btn-toggle-toolbar:hover {
            background-color: #2980b9;
            transform: translateX(-50%) scale(1.05);
        }

        #btn-toggle-toolbar.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2c3e50;
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            flex-direction: column; /* 強制分行結構 */
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 95vw;
        }

        /* 明確定義的兩排工具列 */
        .toolbar-row {
            display: flex;
            flex-wrap: nowrap; /* 絕對不換行至第三行 */
            gap: 8px;
            align-items: center;
            justify-content: safe center; /* 若空間不夠允許從左至右滑動 */
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .toolbar-row::-webkit-scrollbar {
            display: none;
        }

        .drag-handle {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: grab;
            font-weight: bold;
            display: flex;
            align-items: center;
            user-select: none;
            touch-action: none;
            border: 1px dashed #f1c40f;
            font-size: 14px;
            white-space: nowrap;
        }

        .drag-handle:active {
            cursor: grabbing;
            background: rgba(241, 196, 15, 0.4);
        }

        button {
            background-color: transparent;
            border: 2px solid transparent;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: rgba(255,255,255,0.1);
        }

        button.active {
            background-color: #3498db;
            border-color: #2980b9;
        }

        .toolbar-group {
            display: none;
            gap: 5px;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .toolbar-group.show {
            display: flex;
        }

        #size-controls {
            display: none;
            gap: 5px;
            align-items: center;
            color: white;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        #size-controls.show {
            display: flex;
        }

        #size-slider {
            width: 80px;
            cursor: pointer;
            accent-color: #3498db;
        }

        #size-display {
            min-width: 35px;
            text-align: center;
        }

        .reset-size-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 12px;
        }

        .reset-size-btn:hover {
            background-color: #bdc3c7;
            color: #2c3e50;
        }

        .file-controls,
        .font-size-controls,
        .color-picker-container {
            display: flex;
            gap: 5px;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .file-controls button {
            color: #f1c40f;
            border: 1px solid #f1c40f;
        }

        .file-controls button:hover {
            background-color: #f1c40f;
            color: #2c3e50;
        }

        .color-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #ecf0f1;
            cursor: pointer;
            padding: 0;
        }

        .color-btn.white-btn {
            border-color: #95a5a6;
        }

        #pen-options button.active {
            background-color: #8e44ad;
            border-color: #732d91;
        }

        #shape-controls button.active {
            background-color: #16a085;
            border-color: #13856d;
        }

        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1001;
            font-weight: bold;
        }

        /* --- 客製化確認視窗樣式 --- */
        #custom-confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000; /* 確保在最上層 */
            backdrop-filter: blur(2px);
        }

        .confirm-box {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 90%;
        }

        .confirm-box h2 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-family: inherit;
        }

        .confirm-box p {
            margin: 0 0 25px 0;
            color: #7f8c8d;
            font-size: 16px;
        }

        .confirm-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .confirm-btns button {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
        }

        .confirm-btns .btn-cancel {
            background-color: #ecf0f1;
            color: #34495e;
            border: 1px solid #bdc3c7;
        }

        .confirm-btns .btn-cancel:hover {
            background-color: #bdc3c7;
        }

        .confirm-btns .btn-confirm {
            background-color: #e74c3c;
            color: white;
            border: 1px solid #c0392b;
        }

        .confirm-btns .btn-confirm:hover {
            background-color: #c0392b;
        }

        /* --- 新增：版權浮水印 --- */
        #copyright-watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 13px;
            color: rgba(44, 62, 80, 0.5);
            pointer-events: none; /* 讓滑鼠點擊穿透，不影響畫圖 */
            z-index: 990;
            font-weight: bold;
            user-select: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="mode-pen">

<div id="app-container">
    <div id="workspace">
        <div id="image-layer"></div>
        <canvas id="whiteboard" width="3000" height="2000"></canvas>
        <canvas id="shape-preview" width="3000" height="2000"></canvas>
        <div id="text-layer"></div>
    </div>

    <div id="toast">提示訊息</div>

    <!-- --- 新增：版權宣告 --- -->
    <div id="copyright-watermark">© Eddie 版權所有</div>

    <!-- 客製化確認視窗 HTML -->
    <div id="custom-confirm-modal">
        <div class="confirm-box">
            <h2>🗑️ 清除白板</h2>
            <p>確定要清除整個白板上的所有內容嗎？<br><small>(此動作無法復原)</small></p>
            <div class="confirm-btns">
                <button class="btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="btn-confirm" onclick="executeClearCanvas()">確定清除</button>
            </div>
        </div>
    </div>

    <button id="btn-toggle-toolbar" onclick="toggleToolbar()">
        🛠️ 展開工具列
    </button>

    <div id="toolbar">
        <!-- 第一行：主要控制工具與系統選項 -->
        <div class="toolbar-row">
            <div id="toolbar-drag-handle" class="drag-handle" title="按住拖曳工具列">✥ 拖曳</div>
            <button id="btn-minimize-tb" onclick="toggleToolbar()" style="background-color: #e74c3c; border-color: #c0392b;">🔽 收起</button>
            <button id="btn-fullscreen" onclick="toggleFullScreen()" style="color: #ecf0f1; border: 1px dashed #bdc3c7;">🔲 全螢幕</button>
            <button id="btn-move" onclick="setMode('move')">👆 移動</button>
            <button id="btn-pen" class="active" onclick="setMode('pen')">✏️ 畫筆</button>
            <button id="btn-undo" onclick="undoAction()" title="返回上一個動作 (Ctrl+Z)">↶ 返回</button>
            <button id="btn-redo" onclick="redoAction()" title="回復下一個動作 (Ctrl+Y / Ctrl+Shift+Z)">↷ 回復</button>
            <button id="btn-shape" onclick="setMode('shape')">📐 形狀</button>
            <button id="btn-text" onclick="setMode('text')">🔤 文字</button>
            <button id="btn-bg-toggle" onclick="toggleTextBg()">🔲 底色: 無</button>
            <button id="btn-eraser" onclick="setMode('eraser')">🧽 擦布</button>
            <button onclick="requestClearCanvas()">🗑️ 清除</button>
        </div>

        <!-- 第二行：子功能、顏色、粗細、存檔 -->
        <div class="toolbar-row">
            <div id="pen-options" class="toolbar-group">
                <button id="pen-freehand" class="active" onmousedown="setPenType(event, 'freehand')">〰️ 隨意</button>
                <button id="pen-line" onmousedown="setPenType(event, 'line')">📏 直線</button>
                <button id="pen-highlight" onmousedown="setPenType(event, 'highlight')">🖍️ Highlight</button>
            </div>

            <div id="shape-controls" class="toolbar-group">
                <button id="shape-rect" class="active" onmousedown="setShapeType(event, 'rect')">⬜ 方形</button>
                <button id="shape-circle" onmousedown="setShapeType(event, 'circle')">⚪ 圓形</button>
            </div>

            <div id="size-controls" class="toolbar-group">
                <span id="size-icon">✏️</span>
                <input type="range" id="size-slider" min="1" max="100" value="4" oninput="updateSize(this.value)">
                <span id="size-display">4px</span>
                <button class="reset-size-btn" onclick="resetSize()" title="回復預設大小">🔄 預設</button>
            </div>

            <div class="font-size-controls">
                <button onmousedown="changeFontSize(event, 4)">A+</button>
                <button onmousedown="changeFontSize(event, -4)">A-</button>
            </div>

            <div class="color-picker-container">
                <button class="color-btn white-btn" style="background-color: #ffffff;" onmousedown="changeColor(event, '#ffffff')"></button>
                <button class="color-btn" style="background-color: #000000;" onmousedown="changeColor(event, '#000000')"></button>
                <button class="color-btn" style="background-color: #e74c3c;" onmousedown="changeColor(event, '#e74c3c')"></button>
                <button class="color-btn" style="background-color: #2980b9;" onmousedown="changeColor(event, '#2980b9')"></button>
                <button class="color-btn" style="background-color: #27ae60;" onmousedown="changeColor(event, '#27ae60')"></button>
            </div>

            <div class="file-controls">
                <button onclick="backupWhiteboard()">💾 備份</button>
                <button onclick="document.getElementById('file-upload').click()">📂 還原</button>
                <input type="file" id="file-upload" style="display: none;" accept=".wbd" onchange="restoreWhiteboard(event)">
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const previewCanvas = document.getElementById('shape-preview');
    const previewCtx = previewCanvas.getContext('2d');
    const workspace = document.getElementById('workspace');
    const appContainer = document.getElementById('app-container');
    const toast = document.getElementById('toast');
    const textLayer = document.getElementById('text-layer');
    const imageLayer = document.getElementById('image-layer');

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.imageSmoothingEnabled = true;
    previewCtx.lineCap = 'round';
    previewCtx.lineJoin = 'round';
    previewCtx.imageSmoothingEnabled = true;

    let scale = 1;
    let translateX = (window.innerWidth - 3000) / 2;
    let translateY = (window.innerHeight - 2000) / 2;

    let isDrawing = false;
    let currentMode = 'pen';
    let currentColor = '#000000';
    let currentShapeType = 'rect';
    let currentPenType = 'freehand';
    const HIGHLIGHT_COLOR = 'rgba(255, 235, 59, 0.45)';
    const HIGHLIGHT_WIDTH = 28;

    const DEFAULT_PEN_WIDTH = 4;
    const DEFAULT_ERASER_WIDTH = 40;
    let savedPenWidth = parseInt(localStorage.getItem('wb_penWidth'));
    let savedEraserWidth = parseInt(localStorage.getItem('wb_eraserWidth'));
    
    let penWidth = isNaN(savedPenWidth) ? DEFAULT_PEN_WIDTH : savedPenWidth;
    let eraserWidth = isNaN(savedEraserWidth) ? DEFAULT_ERASER_WIDTH : savedEraserWidth;
    
    let activeTextBox = null;
    let historyStack = [];
    let redoStack = [];
    const MAX_HISTORY = 60;
    let isRestoringHistory = false;
    let textHistoryTimers = new WeakMap();

    const DEFAULT_BOX_WIDTH = '250px';
    const DEFAULT_BOX_HEIGHT = '60px';
    let savedFontSize = '32px';
    let globalTextBgEnabled = false;

    let lastPoint = null;
    let shapeStart = null;
    let lineStart = null;
    let moveStartView = null;

    // --- 全螢幕功能 ---
    function toggleFullScreen() {
        const doc = window.document;
        const docEl = doc.documentElement;

        const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
        const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

        if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
            requestFullScreen.call(docEl).catch(err => {
                showToast(`無法進入全螢幕：${err.message}`);
            });
        }
        else {
            cancelFullScreen.call(doc);
        }
    }

    // 監聽全螢幕變化以更新按鈕文字
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
        eventType => document.addEventListener(eventType, updateFullscreenBtn)
    );

    function updateFullscreenBtn() {
        const btn = document.getElementById('btn-fullscreen');
        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
            btn.innerText = '🔲 退出全螢幕';
        } else {
            btn.innerText = '🔲 全螢幕';
        }
    }

    // --- 工具列收合與拖曳邏輯 ---
    const toolbarEl = document.getElementById('toolbar');
    const tbDragHandle = document.getElementById('toolbar-drag-handle');
    let isToolbarMinimized = false;
    
    function toggleToolbar() {
        const btnToggle = document.getElementById('btn-toggle-toolbar');
        isToolbarMinimized = !isToolbarMinimized;
        
        if (isToolbarMinimized) {
            toolbarEl.style.display = 'none';
            btnToggle.classList.add('show');
            showToast('工具列已收起，享有完整白板空間！');
        } else {
            toolbarEl.style.display = 'flex';
            btnToggle.classList.remove('show');
            checkToolbarBounds(); // 展開時檢查是否在螢幕外
        }
    }

    let isDraggingTB = false;
    let tbOffsetX, tbOffsetY;

    const startTBDrag = (e) => {
        isDraggingTB = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const style = window.getComputedStyle(toolbarEl);
        if (style.transform !== 'none') {
            const rect = toolbarEl.getBoundingClientRect();
            toolbarEl.style.transform = 'none';
            toolbarEl.style.left = rect.left + 'px';
            toolbarEl.style.top = rect.top + 'px';
            toolbarEl.style.bottom = 'auto'; 
        }

        const rect = toolbarEl.getBoundingClientRect();
        tbOffsetX = clientX - rect.left;
        tbOffsetY = clientY - rect.top;
        
        e.preventDefault();
        e.stopPropagation();
    };

    const moveTBDrag = (e) => {
        if (!isDraggingTB) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let newLeft = clientX - tbOffsetX;
        let newTop = clientY - tbOffsetY;

        const rect = toolbarEl.getBoundingClientRect();
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - rect.width));
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - rect.height));

        toolbarEl.style.left = newLeft + 'px';
        toolbarEl.style.top = newTop + 'px';
        toolbarEl.style.bottom = 'auto';

        e.preventDefault();
        e.stopPropagation();
    };

    const endTBDrag = () => {
        isDraggingTB = false;
    };

    tbDragHandle.addEventListener('mousedown', startTBDrag);
    tbDragHandle.addEventListener('touchstart', startTBDrag, {passive: false});
    window.addEventListener('mousemove', moveTBDrag, {passive: false});
    window.addEventListener('touchmove', moveTBDrag, {passive: false});
    window.addEventListener('mouseup', endTBDrag);
    window.addEventListener('touchend', endTBDrag);

    // --- 螢幕縮放時，防止工具列跑出視窗外 ---
    function checkToolbarBounds() {
        if (toolbarEl.style.display === 'none' || window.getComputedStyle(toolbarEl).transform !== 'none') return;
        
        const rect = toolbarEl.getBoundingClientRect();
        let currentLeft = parseFloat(toolbarEl.style.left) || 0;
        let currentTop = parseFloat(toolbarEl.style.top) || 0;
        let adjusted = false;

        if (rect.right > window.innerWidth) {
            currentLeft = Math.max(0, window.innerWidth - rect.width - 20);
            adjusted = true;
        }
        if (rect.bottom > window.innerHeight) {
            currentTop = Math.max(0, window.innerHeight - rect.height - 20);
            adjusted = true;
        }
        if (rect.left < 0) { currentLeft = 20; adjusted = true; }
        if (rect.top < 0) { currentTop = 20; adjusted = true; }

        if (adjusted) {
            toolbarEl.style.left = currentLeft + 'px';
            toolbarEl.style.top = currentTop + 'px';
        }
    }
    window.addEventListener('resize', checkToolbarBounds);

    function updateTransform() {
        workspace.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }
    updateTransform();

    function showToast(msg) {
        toast.innerText = msg;
        toast.style.opacity = 1;
        setTimeout(() => toast.style.opacity = 0, 2500);
    }

    function serializeWhiteboard() {
        const data = serializeWhiteboard();

        return data;
    }

    function applyWhiteboardState(data) {
        isRestoringHistory = true;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clearShapePreview();
        textLayer.innerHTML = '';
        imageLayer.innerHTML = '';
        activeTextBox = null;

        const finishRestore = () => {
            updateTextLayerInteractivity();
            updateUndoRedoButtons();
            isRestoringHistory = false;
        };

        if (data.images) {
            data.images.forEach(imgData => {
                createDraggableImage(imgData.src, 0, 0, imgData.left, imgData.top, imgData.width, imgData.height);
            });
        }

        if (data.texts) {
            data.texts.forEach(t => {
                createTextbox(parseFloat(t.left), parseFloat(t.top), t);
            });
        }

        if (data.canvas) {
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                finishRestore();
            };
            img.src = data.canvas;
        } else {
            finishRestore();
        }
    }

    function saveHistory(force = false) {
        if (isRestoringHistory) return;
        const snapshot = JSON.stringify(serializeWhiteboard());
        if (!force && historyStack.length && historyStack[historyStack.length - 1] === snapshot) {
            updateUndoRedoButtons();
            return;
        }
        historyStack.push(snapshot);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
        redoStack = [];
        updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
        const undoBtn = document.getElementById('btn-undo');
        const redoBtn = document.getElementById('btn-redo');
        if (undoBtn) undoBtn.disabled = historyStack.length <= 1;
        if (redoBtn) redoBtn.disabled = redoStack.length === 0;
    }

    function undoAction() {
        if (historyStack.length <= 1) return;
        const currentState = historyStack.pop();
        redoStack.push(currentState);
        const previousState = historyStack[historyStack.length - 1];
        applyWhiteboardState(JSON.parse(previousState));
        showToast('↶ 已返回上一個動作');
    }

    function redoAction() {
        if (!redoStack.length) return;
        const nextState = redoStack.pop();
        historyStack.push(nextState);
        applyWhiteboardState(JSON.parse(nextState));
        showToast('↷ 已回復下一個動作');
    }

    function queueTextHistorySave(textBox) {
        if (!textBox) return;
        const oldTimer = textHistoryTimers.get(textBox);
        if (oldTimer) clearTimeout(oldTimer);
        const timer = setTimeout(() => {
            saveHistory();
            textHistoryTimers.delete(textBox);
        }, 500);
        textHistoryTimers.set(textBox, timer);
    }


    function updateCanvasInteractivity() {
        if (currentMode === 'move') {
            canvas.style.pointerEvents = 'auto';
            canvas.style.cursor = 'grab';
        } else {
            canvas.style.pointerEvents = 'auto';
            canvas.style.cursor = currentMode === 'text' ? 'text' : 'crosshair';
        }
        previewCanvas.style.pointerEvents = 'none';
    }

    function updateTextLayerInteractivity() {
        const allowTextInteraction = currentMode === 'text' || currentMode === 'move';
        textLayer.style.pointerEvents = 'none';
        document.querySelectorAll('.text-wrapper').forEach(wrapper => {
            wrapper.style.pointerEvents = allowTextInteraction ? 'auto' : 'none';
        });
    }

    function updateToolOptionVisibility() {
        document.getElementById('pen-options').classList.toggle('show', currentMode === 'pen');
        document.getElementById('shape-controls').classList.toggle('show', currentMode === 'shape');

        const isSizeTool = ['pen', 'eraser', 'shape'].includes(currentMode);
        document.getElementById('size-controls').classList.toggle('show', isSizeTool);
        
        if (isSizeTool) {
            const slider = document.getElementById('size-slider');
            const isEraser = currentMode === 'eraser';
            const isHighlight = currentMode === 'pen' && currentPenType === 'highlight';
            slider.value = isEraser ? eraserWidth : (isHighlight ? HIGHLIGHT_WIDTH : penWidth);
            slider.max = isEraser ? 200 : 50;
            slider.disabled = isHighlight;
            document.getElementById('size-icon').innerText = isEraser ? '🧽' : (isHighlight ? '🖍️' : '✏️');
            document.getElementById('size-display').innerText = slider.value + 'px';
        }
    }

    function updateSize(val) {
        const isEraser = currentMode === 'eraser';
        if (isEraser) {
            eraserWidth = parseInt(val);
            localStorage.setItem('wb_eraserWidth', eraserWidth);
        } else {
            penWidth = parseInt(val);
            localStorage.setItem('wb_penWidth', penWidth);
        }
        document.getElementById('size-display').innerText = val + 'px';
    }

    function resetSize() {
        const isEraser = currentMode === 'eraser';
        if (isEraser) {
            eraserWidth = DEFAULT_ERASER_WIDTH;
            localStorage.setItem('wb_eraserWidth', eraserWidth);
        } else {
            penWidth = DEFAULT_PEN_WIDTH;
            localStorage.setItem('wb_penWidth', penWidth);
        }
        const slider = document.getElementById('size-slider');
        slider.value = isEraser ? eraserWidth : penWidth;
        document.getElementById('size-display').innerText = slider.value + 'px';
        showToast(`已回復預設${isEraser ? '擦布' : '畫筆'}大小`);
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('#toolbar button[id^="btn-"]').forEach(btn => {
            if (btn.id !== 'btn-bg-toggle' && btn.id !== 'btn-minimize-tb' && btn.id !== 'btn-fullscreen') {
                btn.classList.remove('active');
            }
        });
        const targetBtn = document.getElementById(`btn-${mode}`);
        if (targetBtn) targetBtn.classList.add('active');
        document.body.className = `mode-${mode}`;
        clearShapePreview();
        updateCanvasInteractivity();
        updateToolOptionVisibility();
        updateTextLayerInteractivity();
    }

    function setPenType(e, type) {
        e.preventDefault();
        currentPenType = type;
        document.getElementById('pen-freehand').classList.toggle('active', type === 'freehand');
        document.getElementById('pen-line').classList.toggle('active', type === 'line');
        document.getElementById('pen-highlight').classList.toggle('active', type === 'highlight');
        updateToolOptionVisibility();
    }

    function setShapeType(e, type) {
        e.preventDefault();
        currentShapeType = type;
        document.getElementById('shape-rect').classList.toggle('active', type === 'rect');
        document.getElementById('shape-circle').classList.toggle('active', type === 'circle');
    }

    function changeColor(e, color) {
        e.preventDefault();
        currentColor = color;
        document.execCommand('foreColor', false, color);
    }

    function changeFontSize(e, delta) {
        e.preventDefault();
        if (activeTextBox) {
            let currentSize = window.getComputedStyle(activeTextBox, null).getPropertyValue('font-size');
            let newSize = parseFloat(currentSize) + delta;
            if (newSize > 12 && newSize < 120) {
                activeTextBox.style.fontSize = newSize + 'px';
                savedFontSize = newSize + 'px';
                activeTextBox.dispatchEvent(new Event('input'));
                saveHistory();
            }
        }
    }

    function updateBgButtonUI(isEnabled) {
        const btn = document.getElementById('btn-bg-toggle');
        if (isEnabled) {
            btn.innerText = '🔳 底色: 白';
            btn.classList.add('active');
        } else {
            btn.innerText = '🔲 底色: 無';
            btn.classList.remove('active');
        }
    }

    function toggleTextBg() {
        if (activeTextBox) {
            let currentState = activeTextBox.dataset.hasBg === 'true';
            activeTextBox.dataset.hasBg = (!currentState).toString();
            activeTextBox.style.backgroundColor = !currentState ? 'rgba(255, 255, 255, 0.9)' : 'transparent';
            updateBgButtonUI(!currentState);
            saveHistory();
            showToast(!currentState ? '已為此文字框開啟底色' : '已為此文字框關閉底色');
        } else {
            globalTextBgEnabled = !globalTextBgEnabled;
            updateBgButtonUI(globalTextBgEnabled);
            showToast(globalTextBgEnabled ? '已開啟預設文字底色' : '已關閉預設文字底色');
        }
    }

    function getWorkspaceCoords(clientX, clientY) {
        return { x: (clientX - translateX) / scale, y: (clientY - translateY) / scale };
    }

    function clearShapePreview() {
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    }

    function drawSmoothSegment(from, to) {
        const midX = (from.x + to.x) / 2;
        const midY = (from.y + to.y) / 2;
        ctx.quadraticCurveTo(from.x, from.y, midX, midY);
        ctx.stroke();
    }

    function applyCurrentStrokeStyle(targetCtx) {
        const isHighlighter = currentMode === 'pen' && currentPenType === 'highlight';
        targetCtx.globalCompositeOperation = 'source-over';
        targetCtx.strokeStyle = isHighlighter ? HIGHLIGHT_COLOR : currentColor;
        targetCtx.lineWidth = isHighlighter ? HIGHLIGHT_WIDTH : (currentMode === 'eraser' ? eraserWidth : penWidth);
        targetCtx.globalAlpha = 1;
    }


    function drawShapePreview(start, end) {
        clearShapePreview();
        previewCtx.globalCompositeOperation = 'source-over';
        previewCtx.strokeStyle = currentColor;
        previewCtx.lineWidth = penWidth;
        previewCtx.beginPath();

        const x = Math.min(start.x, end.x);
        const y = Math.min(start.y, end.y);
        const w = Math.abs(end.x - start.x);
        const h = Math.abs(end.y - start.y);

        if (currentShapeType === 'rect') {
            previewCtx.strokeRect(x, y, w, h);
        } else {
            const centerX = x + w / 2;
            const centerY = y + h / 2;
            previewCtx.ellipse(centerX, centerY, w / 2, h / 2, 0, 0, Math.PI * 2);
            previewCtx.stroke();
        }
        previewCtx.closePath();
    }

    function commitShape(start, end) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = penWidth;
        ctx.beginPath();

        const x = Math.min(start.x, end.x);
        const y = Math.min(start.y, end.y);
        const w = Math.abs(end.x - start.x);
        const h = Math.abs(end.y - start.y);

        if (w < 2 || h < 2) {
            ctx.restore();
            clearShapePreview();
            return;
        }

        if (currentShapeType === 'rect') {
            ctx.strokeRect(x, y, w, h);
        } else {
            const centerX = x + w / 2;
            const centerY = y + h / 2;
            ctx.ellipse(centerX, centerY, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.closePath();
        ctx.restore();
        clearShapePreview();
    }

    function drawLinePreview(start, end) {
        clearShapePreview();
        previewCtx.globalCompositeOperation = 'source-over';
        previewCtx.strokeStyle = currentColor;
        previewCtx.lineWidth = penWidth;
        previewCtx.beginPath();
        previewCtx.moveTo(start.x, start.y);
        previewCtx.lineTo(end.x, end.y);
        previewCtx.stroke();
        previewCtx.closePath();
    }

    function commitLine(start, end) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = penWidth;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.closePath();
        ctx.restore();
        clearShapePreview();
    }

    let initialPinchDist = null;
    let lastTouchCenter = null;

    appContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            isDrawing = false;
            moveStartView = null;
            initialPinchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            lastTouchCenter = {
                x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                y: (e.touches[0].clientY + e.touches[1].clientY) / 2
            };
        }
    }, { passive: false });

    appContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && lastTouchCenter) {
            e.preventDefault();

            const currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const currentCenter = {
                x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                y: (e.touches[0].clientY + e.touches[1].clientY) / 2
            };

            const scaleFactor = currentDist / initialPinchDist;
            let newScale = Math.max(0.3, Math.min(scale * scaleFactor, 5));
            const scaleRatio = newScale / scale;

            translateX = currentCenter.x - (currentCenter.x - translateX) * scaleRatio + (currentCenter.x - lastTouchCenter.x);
            translateY = currentCenter.y - (currentCenter.y - translateY) * scaleRatio + (currentCenter.y - lastTouchCenter.y);

            scale = newScale;
            initialPinchDist = currentDist;
            lastTouchCenter = currentCenter;
            updateTransform();
        }
    }, { passive: false });

    appContainer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
            initialPinchDist = null;
            lastTouchCenter = null;
        }
    });

    appContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        let newScale = Math.max(0.3, Math.min(scale * Math.exp((e.deltaY < 0 ? 1 : -1) * 0.1), 5));
        const scaleRatio = newScale / scale;

        translateX = e.clientX - (e.clientX - translateX) * scaleRatio;
        translateY = e.clientY - (e.clientY - translateY) * scaleRatio;

        scale = newScale;
        updateTransform();
    }, { passive: false });

    let isDraggingItem = false;
    let startX, startY, startLeft, startTop;
    let activeDragElement = null;

    canvas.addEventListener('mousedown', startAction);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endAction);
    canvas.addEventListener('mouseout', endAction);

    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) startAction(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) draw(e);
    }, { passive: false });

    canvas.addEventListener('touchend', endAction);

    function startAction(e) {
        if (e.touches && e.touches.length > 1) return;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pos = getWorkspaceCoords(clientX, clientY);

        let isDeselecting = false;
        if (e.target === canvas) {
            e.preventDefault();
            if (activeTextBox) {
                activeTextBox.blur();
                if (activeTextBox.parentElement) activeTextBox.parentElement.classList.remove('active');
                activeTextBox = null;
                isDeselecting = true;
            }
        }

        if (currentMode === 'text') {
            if (isDeselecting) return;
            createTextbox(pos.x, pos.y);
            return;
        }

        if (currentMode === 'move') {
            moveStartView = { clientX, clientY, translateX, translateY };
            canvas.style.cursor = 'grabbing';
            return;
        }

        if (currentMode === 'shape') {
            shapeStart = pos;
            isDrawing = true;
            drawShapePreview(shapeStart, pos);
            return;
        }

        if (currentMode === 'pen' && currentPenType === 'line') {
            lineStart = pos;
            isDrawing = true;
            drawLinePreview(lineStart, pos);
            return;
        }

        isDrawing = true;
        lastPoint = pos;

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);

        if (currentMode === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = eraserWidth;
        } else {
            applyCurrentStrokeStyle(ctx);
        }

        if (currentMode === 'pen' && (currentPenType === 'freehand' || currentPenType === 'highlight')) {
            ctx.lineTo(pos.x + 0.01, pos.y + 0.01);
            ctx.stroke();
        } else if (currentMode === 'eraser') {
            ctx.lineTo(pos.x + 0.01, pos.y + 0.01);
            ctx.stroke();
        }
    }

    function draw(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (currentMode === 'move' && moveStartView) {
            e.preventDefault();
            translateX = moveStartView.translateX + (clientX - moveStartView.clientX);
            translateY = moveStartView.translateY + (clientY - moveStartView.clientY);
            updateTransform();
            return;
        }

        if (!isDrawing) return;
        e.preventDefault();

        const pos = getWorkspaceCoords(clientX, clientY);

        if (currentMode === 'shape') {
            drawShapePreview(shapeStart, pos);
            return;
        }

        if (currentMode === 'pen' && currentPenType === 'line') {
            drawLinePreview(lineStart, pos);
            return;
        }

        if ((currentMode === 'pen' && (currentPenType === 'freehand' || currentPenType === 'highlight')) || currentMode === 'eraser') {
            drawSmoothSegment(lastPoint, pos);
            lastPoint = pos;
        }
    }

    function endAction(e) {
        if (currentMode === 'move') {
            moveStartView = null;
            canvas.style.cursor = 'grab';
        }

        if (currentMode === 'shape' && isDrawing && shapeStart) {
            let clientX, clientY;

            if (e && e.changedTouches && e.changedTouches[0]) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else if (e) {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            if (typeof clientX === 'number' && typeof clientY === 'number') {
                const endPos = getWorkspaceCoords(clientX, clientY);
                commitShape(shapeStart, endPos);
            }
        }

        if (currentMode === 'pen' && currentPenType === 'line' && isDrawing && lineStart) {
            let clientX, clientY;

            if (e && e.changedTouches && e.changedTouches[0]) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else if (e) {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            if (typeof clientX === 'number' && typeof clientY === 'number') {
                const endPos = getWorkspaceCoords(clientX, clientY);
                commitLine(lineStart, endPos);
            }
        }

        const shouldSaveHistory = isDrawing && ['pen', 'shape', 'eraser'].includes(currentMode);

        isDrawing = false;
        shapeStart = null;
        lineStart = null;
        lastPoint = null;
        ctx.closePath();

        if (shouldSaveHistory) {
            saveHistory();
        }
    }

    function createTextbox(x, y, restoreData = null) {
        const wrapper = document.createElement('div');
        wrapper.className = 'text-wrapper';
        wrapper.style.left = x + 'px';
        wrapper.style.top = y + 'px';

        const handle = document.createElement('div');
        handle.className = 'text-drag-handle';
        
        handle.innerHTML = '<span class="drag-text">✥ 移動</span>';
        
        // --- 建立放「複製」與「刪除」按鈕的群組 ---
        const btnGroup = document.createElement('div');
        btnGroup.style.display = 'flex';
        btnGroup.style.gap = '5px';

        const copyBtn = document.createElement('span');
        copyBtn.className = 'text-copy-btn';
        copyBtn.innerHTML = '📋 複製';
        copyBtn.title = '複製文字框';
        
        const executeCopy = (e) => {
            e.stopPropagation();
            e.preventDefault(); 
            const currentLeft = parseFloat(wrapper.style.left) || 0;
            const currentTop = parseFloat(wrapper.style.top) || 0;
            const copiedData = {
                width: textBox.style.width,
                height: textBox.style.height,
                fontSize: textBox.style.fontSize,
                color: textBox.style.color,
                hasBg: textBox.dataset.hasBg,
                content: textBox.innerHTML
            };
            createTextbox(currentLeft + 30, currentTop + 30, copiedData);
            saveHistory();
            showToast('📋 已複製文字框！');
        };

        copyBtn.addEventListener('mousedown', executeCopy);
        copyBtn.addEventListener('touchstart', executeCopy, { passive: false });
        
        // --- 新增刪除按鈕 ---
        const delBtn = document.createElement('span');
        delBtn.className = 'text-del-btn';
        delBtn.innerHTML = '🗑️ 刪除';
        delBtn.title = '刪除文字框';

        const executeDel = (e) => {
            e.stopPropagation();
            e.preventDefault();
            wrapper.remove(); // 直接將整個文字框從畫面上移除
            if (activeTextBox === textBox) {
                activeTextBox = null;
            }
            saveHistory();
            showToast('🗑️ 已刪除文字框！');
        };

        delBtn.addEventListener('mousedown', executeDel);
        delBtn.addEventListener('touchstart', executeDel, { passive: false });
        
        btnGroup.appendChild(copyBtn);
        btnGroup.appendChild(delBtn);
        handle.appendChild(btnGroup);
        // ------------------------------------

        const textBox = document.createElement('div');
        textBox.className = 'text-box';
        textBox.contentEditable = true;

        if (restoreData) {
            textBox.style.width = restoreData.width;
            textBox.style.height = restoreData.height;
            textBox.style.fontSize = restoreData.fontSize;
            textBox.style.color = restoreData.color;
            textBox.dataset.hasBg = restoreData.hasBg;
            textBox.innerHTML = restoreData.content;
            textBox.style.backgroundColor = restoreData.hasBg === 'true' ? 'rgba(255, 255, 255, 0.9)' : 'transparent';
        } else {
            wrapper.classList.add('active');
            textBox.style.width = DEFAULT_BOX_WIDTH;
            textBox.style.height = DEFAULT_BOX_HEIGHT;
            textBox.style.fontSize = savedFontSize;
            textBox.style.color = currentColor;
            textBox.dataset.hasBg = globalTextBgEnabled.toString();
            textBox.style.backgroundColor = globalTextBgEnabled ? 'rgba(255, 255, 255, 0.9)' : 'transparent';
        }

        wrapper.appendChild(handle);
        wrapper.appendChild(textBox);
        textLayer.appendChild(wrapper);

        if (!restoreData) {
            activeTextBox = textBox;
            updateBgButtonUI(textBox.dataset.hasBg === 'true');
        }

        updateTextLayerInteractivity();

        textBox.addEventListener('input', function() {
            if (this.scrollWidth > this.clientWidth) this.style.width = (this.scrollWidth + 4) + 'px';
            if (this.scrollHeight > this.clientHeight) this.style.height = (this.scrollHeight + 4) + 'px';
            queueTextHistorySave(this);
        });

        const dragStartText = (e) => {
            if (currentMode !== 'text' && currentMode !== 'move') return;

            isDraggingItem = true;
            activeDragElement = wrapper;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pos = getWorkspaceCoords(clientX, clientY);

            startX = pos.x;
            startY = pos.y;
            startLeft = parseFloat(wrapper.style.left) || 0;
            startTop = parseFloat(wrapper.style.top) || 0;

            e.stopPropagation();
            e.preventDefault();
        };

        handle.addEventListener('mousedown', dragStartText);
        handle.addEventListener('touchstart', dragStartText, { passive: false });

        if (!restoreData) {
            setTimeout(() => textBox.focus(), 0);
            saveHistory();
        }

        textBox.addEventListener('focus', function() {
            activeTextBox = this;
            wrapper.classList.add('active');
            updateBgButtonUI(this.dataset.hasBg === 'true');
            this.style.backgroundColor = this.dataset.hasBg === 'true' ? 'rgba(255, 255, 255, 0.9)' : 'transparent';
        });

        textBox.addEventListener('blur', function() {
            setTimeout(() => {
                if (document.activeElement !== this) {
                    if (this.innerText.trim() === '') {
                        wrapper.remove();
                        if (activeTextBox === this) activeTextBox = null;
                        saveHistory();
                    } else {
                        wrapper.classList.remove('active');
                        this.style.backgroundColor = this.dataset.hasBg === 'true' ? 'rgba(255, 255, 255, 0.9)' : 'transparent';
                        saveHistory();
                    }
                }
            }, 50);
        });
    }

    window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items || [];
        for (let item of items) {
            if (item.type.indexOf('image') === 0) {
                const blob = item.getAsFile();
                const reader = new FileReader();

                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        createDraggableImage(img.src, img.width, img.height);
                        showToast('圖片已貼上！已自動切換為「移動」工具');
                        setMode('move');
                    };
                    img.src = event.target.result;
                };

                reader.readAsDataURL(blob);
            }
        }
    });

    function createDraggableImage(src, origW, origH, restoreLeft = null, restoreTop = null, restoreWidth = null, restoreHeight = null) {
        const wrapper = document.createElement('div');
        wrapper.className = 'pasted-image-wrapper';

        const img = document.createElement('img');
        img.src = src;

        if (restoreLeft !== null) {
            wrapper.style.width = restoreWidth;
            wrapper.style.height = restoreHeight;
            wrapper.style.left = restoreLeft;
            wrapper.style.top = restoreTop;
        } else {
            let w = origW;
            let h = origH;
            const maxW = 1000;

            if (w > maxW) {
                h = h * (maxW / w);
                w = maxW;
            }

            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';

            const viewCenterX = (window.innerWidth / 2 - translateX) / scale;
            const viewCenterY = (window.innerHeight / 2 - translateY) / scale;
            wrapper.style.left = (viewCenterX - w / 2) + 'px';
            wrapper.style.top = (viewCenterY - h / 2) + 'px';
        }

        const delBtn = document.createElement('button');
        delBtn.innerHTML = '🗑️';
        delBtn.className = 'img-del-btn';
        
        // --- 圖片刪除按鈕也統一修改觸發機制防異常 ---
        const executeImgDel = (e) => {
            e.stopPropagation();
            e.preventDefault();
            wrapper.remove();
            saveHistory();
        };
        delBtn.addEventListener('mousedown', executeImgDel);
        delBtn.addEventListener('touchstart', executeImgDel, { passive: false });

        const copyBtn = document.createElement('button');
        copyBtn.innerHTML = '📋';
        copyBtn.className = 'img-copy-btn';
        copyBtn.title = '複製圖片';
        
        // --- 圖片複製按鈕也統一修改觸發機制防異常 ---
        const executeImgCopy = (e) => {
            e.stopPropagation();
            e.preventDefault();
            const currentLeft = parseFloat(wrapper.style.left) || 0;
            const currentTop = parseFloat(wrapper.style.top) || 0;
            createDraggableImage(src, 0, 0, (currentLeft + 30) + 'px', (currentTop + 30) + 'px', wrapper.style.width, wrapper.style.height);
            saveHistory();
            showToast('📋 已複製圖片！');
        };
        copyBtn.addEventListener('mousedown', executeImgCopy);
        copyBtn.addEventListener('touchstart', executeImgCopy, { passive: false });

        wrapper.appendChild(img);
        wrapper.appendChild(copyBtn);
        wrapper.appendChild(delBtn);
        imageLayer.appendChild(wrapper);

        const dragStartImg = (e) => {
            if (currentMode !== 'move') return;

            isDraggingItem = true;
            activeDragElement = wrapper;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pos = getWorkspaceCoords(clientX, clientY);

            startX = pos.x;
            startY = pos.y;
            startLeft = parseFloat(wrapper.style.left);
            startTop = parseFloat(wrapper.style.top);

            e.stopPropagation();
            e.preventDefault();
        };

        wrapper.addEventListener('mousedown', dragStartImg);
        wrapper.addEventListener('touchstart', dragStartImg, { passive: false });

        if (restoreLeft === null && !isRestoringHistory) {
            saveHistory();
        }
    }

    const dragMove = (e) => {
        if (!isDraggingItem || !activeDragElement) return;
        if (e.touches && e.touches.length > 1) return;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pos = getWorkspaceCoords(clientX, clientY);

        activeDragElement.style.left = (startLeft + (pos.x - startX)) + 'px';
        activeDragElement.style.top = (startTop + (pos.y - startY)) + 'px';

        e.preventDefault();
        e.stopPropagation();
    };

    const dragEnd = () => {
        if (isDraggingItem && activeDragElement) {
            saveHistory();
        }
        isDraggingItem = false;
        activeDragElement = null;
    };

    window.addEventListener('mousemove', dragMove);
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('touchend', dragEnd);

    function backupWhiteboard() {
        showToast('正在打包資料，請稍候...');

        const data = serializeWhiteboard();

        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;

        const date = new Date();
        const timeString = `${date.getMonth() + 1}${date.getDate()}_${date.getHours()}${date.getMinutes()}`;
        a.download = `白板備課資料_${timeString}.wbd`;

        a.click();
        URL.revokeObjectURL(url);
        showToast('💾 備份檔案已成功下載！');
    }

    function restoreWhiteboard(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result);

                applyWhiteboardState(data);
                historyStack = [JSON.stringify(data)];
                redoStack = [];
                updateUndoRedoButtons();
                showToast('📂 備份檔還原成功！');
            } catch (err) {
                alert('無法還原：備份檔格式不正確。');
            }
        };

        reader.readAsText(file);
        e.target.value = '';
    }

    // --- 自定義清除邏輯，替代 confirm() ---
    function requestClearCanvas() {
        document.getElementById('custom-confirm-modal').style.display = 'flex';
    }

    function closeConfirmModal() {
        document.getElementById('custom-confirm-modal').style.display = 'none';
    }

    function executeClearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clearShapePreview();
        textLayer.innerHTML = '';
        imageLayer.innerHTML = '';
        activeTextBox = null;
        updateTextLayerInteractivity();
        closeConfirmModal();
        saveHistory(true);
        showToast('✨ 白板已清空！');
    }


    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (e.ctrlKey || e.metaKey) {
            if (key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undoAction();
            } else if (key === 'y' || (key === 'z' && e.shiftKey)) {
                e.preventDefault();
                redoAction();
            }
        }
    });

    saveHistory(true);
    updateUndoRedoButtons();
    updateCanvasInteractivity();
    updateToolOptionVisibility();
    updateTextLayerInteractivity();
</script>
</body>
</html>
